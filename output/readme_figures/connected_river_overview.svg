<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The Connected River workflow</title>
  <desc id="desc">Four stages connect monitoring data: collect, prepare, match and explore.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17333c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b858d"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#f7faf9"/>

  <text x="600" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17333c">Connecting evidence along the river network</text>
  <text x="600" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526970">A reusable route from separate monitoring records to joined data and analysis</text>

  <path d="M284 245 H332" stroke="#6b858d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M568 245 H616" stroke="#6b858d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M852 245 H900" stroke="#6b858d" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="52" y="150" width="232" height="190" rx="20" fill="#ffffff"/>
    <circle cx="168" cy="201" r="29" fill="#e4f2f1"/>
    <text x="168" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#237f83">01</text>
    <text x="168" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17333c">Collect</text>
    <text x="168" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526970">Biology, chemistry, flow</text>
    <text x="168" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526970">and river-network data</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="336" y="150" width="232" height="190" rx="20" fill="#ffffff"/>
    <circle cx="452" cy="201" r="29" fill="#e4f2f1"/>
    <text x="452" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#237f83">02</text>
    <text x="452" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17333c">Prepare</text>
    <text x="452" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526970">Clean and harmonise</text>
    <text x="452" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526970">sites, dates and measures</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="136" width="232" height="218" rx="20" fill="#197f85"/>
    <rect x="630" y="116" width="212" height="38" rx="19" fill="#f2ad38"/>
    <text x="736" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#17333c">EDITABLE MATCHING RECIPE</text>
    <circle cx="736" cy="201" r="29" fill="#ffffff" opacity="0.94"/>
    <text x="736" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#197f85">03</text>
    <text x="736" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Match</text>
    <text x="736" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#eaf6f5">Filter routes, rank candidates</text>
    <text x="736" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#eaf6f5">and accept defensible links</text>
    <text x="736" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffd98b">100-point scoring system</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="904" y="150" width="232" height="190" rx="20" fill="#ffffff"/>
    <circle cx="1020" cy="201" r="29" fill="#e4f2f1"/>
    <text x="1020" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#237f83">04</text>
    <text x="1020" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17333c">Explore</text>
    <text x="1020" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526970">Map coverage and examine</text>
    <text x="1020" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526970">patterns through time</text>
  </g>

  <text x="600" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7f85">Every selected match retains its score, route and decision</text>
</svg>
